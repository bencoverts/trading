openapi: 3.1.0
info:
  title: Demo Trading Platform API
  version: 1.0.0
  description: |
    Backend for a **demo-only** binary-options style trading platform.
    All balances are virtual; there is no deposit, withdrawal or real money anywhere.

    Conventions:
      - money: requests use major units (`amount`), responses include `amount` and `amountCents`
      - timestamps: Unix epoch milliseconds, always produced by the server
      - errors: `{ "error": { "code", "message", "details?" } }`
    WebSocket contract: see docs/API.md §4.
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: local development
tags:
  - name: health
  - name: auth
  - name: account
  - name: market
  - name: trading
  - name: admin
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness/readiness probe
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: database unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a user and open a funded demo account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/me:
    get:
      tags: [account]
      summary: Current user, demo balance and trading limits
      responses:
        '200':
          description: profile
          content:
            application/json:
              schema:
                type: object
                required: [user, account, limits]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  account: { $ref: '#/components/schemas/Account' }
                  limits: { $ref: '#/components/schemas/Limits' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/account/reset:
    post:
      tags: [account]
      summary: Reset the virtual balance (voids open trades as full-refund draws)
      responses:
        '200':
          description: reset
          content:
            application/json:
              schema:
                type: object
                required: [account, voidedTrades]
                properties:
                  account: { $ref: '#/components/schemas/Account' }
                  voidedTrades: { type: integer, example: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/market:
    get:
      tags: [market]
      summary: Active symbol, timeframes and trading limits
      security: []
      responses:
        '200':
          description: market configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Market' }

  /api/candles:
    get:
      tags: [market]
      summary: Server-aggregated OHLC candles (history + forming candle)
      security: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, example: ASIA50 }
        - name: tf
          in: query
          schema: { type: string, enum: [5s, 15s, 30s, 1m, 5m], default: 1m }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: before
          in: query
          description: only candles with t < before (epoch ms)
          schema: { type: integer, format: int64 }
        - name: includeCurrent
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: candles, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [symbol, tf, tfMs, serverTime, candles]
                properties:
                  symbol: { type: string }
                  tf: { type: string }
                  tfMs: { type: integer }
                  serverTime: { type: integer, format: int64 }
                  priceDecimals: { type: integer }
                  seq: { type: integer }
                  lastPrice: { type: number, nullable: true }
                  candles:
                    type: array
                    items: { $ref: '#/components/schemas/Candle' }
                  current: { $ref: '#/components/schemas/Candle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: inactive symbol
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/ticks:
    get:
      tags: [market]
      summary: Recent ticks from the in-memory ring buffer
      security: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: epoch ms (inclusive)
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
      responses:
        '200':
          description: newest matching ticks
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol: { type: string }
                  serverTime: { type: integer, format: int64 }
                  priceDecimals: { type: integer }
                  seq: { type: integer }
                  ticks:
                    type: array
                    items:
                      type: object
                      properties:
                        price: { type: number }
                        time: { type: integer, format: int64 }
                        seq: { type: integer }

  /api/trades:
    post:
      tags: [trading]
      summary: Open a demo trade (stake is held immediately)
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 8–128 chars, `[A-Za-z0-9._:-]+`; a replay returns the original trade
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrade' }
      responses:
        '201':
          description: trade opened
          headers:
            Idempotency-Key:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  trade: { $ref: '#/components/schemas/Trade' }
        '200':
          description: idempotent replay of an existing trade
          headers:
            Idempotent-Replayed:
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  trade: { $ref: '#/components/schemas/Trade' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: idempotency key reused with a different payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: insufficient funds, trade limit, duration or symbol not allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: price feed not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [trading]
      summary: List the caller's trades
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed, all], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: trades, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items: { $ref: '#/components/schemas/Trade' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/trades/{id}:
    get:
      tags: [trading]
      summary: Get one of the caller's trades
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: trade
          content:
            application/json:
              schema:
                type: object
                properties:
                  trade: { $ref: '#/components/schemas/Trade' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/trades/{id}/status:
    get:
      tags: [trading]
      summary: Lightweight status/result
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [open, closed] }
                  result: { type: string, enum: [win, lose, draw], nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/settings:
    get:
      tags: [admin]
      summary: Read runtime business settings
      responses:
        '200':
          description: settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/RuntimeSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [admin]
      summary: Update payout, durations, limits, feed mood/volatility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                payoutRate: { type: number, minimum: 0, maximum: 5 }
                payoutMode: { type: string, enum: [profit, total] }
                allowedDurations:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 3600 }
                  maxItems: 12
                minAmount: { type: number, exclusiveMinimum: 0 }
                maxAmount: { type: number, exclusiveMinimum: 0 }
                maxOpenTrades: { type: integer, minimum: 1, maximum: 100 }
                mood: { type: string, enum: [sepi, normal, cepat, liar] }
                volatility: { type: number, minimum: 0.01, maximum: 20 }
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/RuntimeSettings' }
                  source: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/feed:
    get:
      tags: [admin]
      summary: Price source state
      responses:
        '200':
          description: feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: object, additionalProperties: true }
                  symbol: { type: string }
                  lastPrice: { type: number, nullable: true }
                  lastTick:
                    type: object
                    nullable: true
                    properties:
                      seq: { type: integer }
                      price: { type: number }
                      time: { type: integer, format: int64 }
                  seq: { type: integer }
                  tickIntervalMs: { type: integer }

  /api/admin/settle:
    post:
      tags: [admin]
      summary: Force a settlement pass
      responses:
        '200':
          description: settled trades
          content:
            application/json:
              schema:
                type: object
                properties:
                  settled: { type: integer }
                  trades:
                    type: array
                    items: { $ref: '#/components/schemas/Trade' }

  /api/admin/stats:
    get:
      tags: [admin]
      summary: Trade and account aggregates
      responses:
        '200':
          description: stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: object
                    properties:
                      total: { type: integer }
                      open: { type: integer }
                      closed: { type: integer }
                      wins: { type: integer }
                      losses: { type: integer }
                      draws: { type: integer }
                      wagered: { type: number }
                      paidOut: { type: number }
                      ggr: { type: number }
                      openExposure: { type: number }
                  accounts:
                    type: object
                    properties:
                      users: { type: integer }
                      totalBalance: { type: number }
                      currency: { type: string }
                  settings: { $ref: '#/components/schemas/RuntimeSettings' }
                  feed: { type: object, additionalProperties: true }
                  generatedAt: { type: integer, format: int64 }

  /api/admin/trades:
    get:
      tags: [admin]
      summary: All trades with owner email
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: trades
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Trade' }
                        - type: object
                          properties:
                            email: { type: string }

  /api/admin/audit:
    get:
      tags: [admin]
      summary: Audit trail
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: action
          in: query
          schema: { type: string, maxLength: 64 }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        user_id: { type: string, nullable: true }
                        actor: { type: string, enum: [user, admin, system] }
                        action: { type: string }
                        trade_id: { type: string, nullable: true }
                        meta: { type: string, nullable: true }
                        ip: { type: string, nullable: true }
                        created_at: { type: integer, format: int64 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }

    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        createdAt: { type: integer, format: int64 }

    Account:
      type: object
      required: [balance, balanceCents, currency]
      properties:
        balance: { type: number, description: major units }
        balanceCents: { type: integer, description: minor units }
        currency: { type: string, example: USD }

    AuthResponse:
      type: object
      required: [token, user, account]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
        account: { $ref: '#/components/schemas/Account' }

    Limits:
      type: object
      properties:
        minAmount: { type: number }
        maxAmount: { type: number }
        allowedDurations:
          type: array
          items: { type: integer }
        payoutRate: { type: number }
        payoutMode: { type: string, enum: [profit, total] }
        maxOpenTrades: { type: integer }
        openTrades: { type: integer }

    Market:
      type: object
      properties:
        symbol: { type: string }
        symbolName: { type: string }
        timeframes:
          type: array
          items: { type: string }
        timeframeMs:
          type: object
          additionalProperties: { type: integer }
        priceDecimals: { type: integer }
        currency: { type: string }
        serverTime: { type: integer, format: int64 }
        trading:
          type: object
          properties:
            allowedDurations:
              type: array
              items: { type: integer }
            minAmount: { type: number }
            maxAmount: { type: number }
            payoutRate: { type: number }
            payoutMode: { type: string, enum: [profit, total] }
            maxOpenTrades: { type: integer }

    Candle:
      type: object
      required: [t, o, h, l, c]
      properties:
        t: { type: integer, format: int64, description: bucket start, epoch ms }
        o: { type: number }
        h: { type: number }
        l: { type: number }
        c: { type: number }

    CreateTrade:
      type: object
      required: [symbol, direction, amount, durationSec]
      properties:
        symbol: { type: string, example: ASIA50 }
        direction: { type: string, enum: [up, down] }
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01, example: 10 }
        durationSec: { type: integer, minimum: 1, maximum: 86400, example: 5 }

    Trade:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        symbol: { type: string }
        direction: { type: string, enum: [up, down] }
        amount: { type: number }
        amountCents: { type: integer }
        durationSec: { type: integer }
        entryPrice: { type: number }
        entryTime: { type: integer, format: int64 }
        expiryTime: { type: integer, format: int64 }
        closePrice: { type: number, nullable: true }
        status: { type: string, enum: [open, closed] }
        result: { type: string, enum: [win, lose, draw], nullable: true }
        payoutRate: { type: number }
        payoutMode: { type: string, enum: [profit, total] }
        payout: { type: number, nullable: true, description: total credited when settled }
        payoutCents: { type: integer, nullable: true }
        profit: { type: number, nullable: true, description: payout - stake }
        createdAt: { type: integer, format: int64 }

    RuntimeSettings:
      type: object
      properties:
        payoutRate: { type: number }
        payoutMode: { type: string, enum: [profit, total] }
        allowedDurations:
          type: array
          items: { type: integer }
        minAmountCents: { type: integer }
        maxAmountCents: { type: integer }
        maxOpenTrades: { type: integer }
        mood: { type: string, enum: [sepi, normal, cepat, liar] }
        volatility: { type: number }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        serverTime: { type: integer, format: int64 }
        uptimeSec: { type: integer }
        db: { type: string, enum: [ok, error] }
        engine:
          type: object
          properties:
            symbol: { type: string }
            lastSeq: { type: integer }
            lastPrice: { type: number, nullable: true }
            lastTickAgeMs: { type: integer, nullable: true }
            source: { type: object, additionalProperties: true }
        realtime:
          type: object
          properties:
            connections: { type: integer }
        version: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

  responses:
    BadRequest:
      description: validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: admin role required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
