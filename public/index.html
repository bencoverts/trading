<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Simulated trading platform - virtual demo money only" />
    <title>Simulated Trading · Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="sim-banner" role="note">
      <strong>SIMULASI</strong>
      <span>Simulated prices and virtual demo balances. No real money, no deposits, no withdrawals.</span>
    </div>

    <header class="topbar">
      <a class="brand" href="/trading" data-link>
        <span class="brand-mark">◆</span>
        <span>SimTrade<small>demo</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="topbar-right">
        <span class="conn" id="conn" data-state="offline">offline</span>
        <div class="balance-pill" id="balancePill" hidden>
          <span class="label">Demo balance</span>
          <strong id="balanceValue">–</strong>
          <button class="link" id="currencyToggle" type="button" title="Change display currency">USD</button>
        </div>
        <a class="btn small" href="/login" data-link id="authLink">Sign in</a>
      </div>
    </header>

    <main id="view" class="view"></main>

    <div id="modalHost"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
