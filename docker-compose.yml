# Optional single-service stack for local demos.
# Copy .env.example to .env and change JWT_SECRET / ADMIN_PASSWORD first.
services:
  app:
    build: .
    image: simtrade-demo:local
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SQLITE_PATH: /app/data/simulated-trading.sqlite
      UPLOADS_DIR: /app/data/uploads
      BACKUP_DIR: /app/data/backups
    volumes:
      - simtrade-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  simtrade-data:
